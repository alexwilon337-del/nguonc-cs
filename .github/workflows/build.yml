name: Build NguonC

on:
  push:
    branches-ignore: [builds]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build plugin
        run: gradle make makePluginsJson --stacktrace

      - name: Publish nhánh builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp NguonC/build/*.cs3 out/
          cp build/plugins.json out/
          cat > out/repo.json <<EOF
          {
            "name": "NguonC",
            "description": "Plugin CloudStream cho phim.nguonc.com",
            "manifestVersion": 1,
            "pluginLists": ["https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json"]
          }
          EOF
          cd out
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
